<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการชำระเงิน - Chubby Sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pastel-blue-dark: #6CA6CD;
            --pastel-blue: #A2D2FF;
            --pastel-blue-light: #EBF4FA;
            --pastel-pink: #FFC8DD;
            --pastel-yellow: #FEF9E7;
            --text-main: #4A5568;
            --text-sub: #718096;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Mitr', sans-serif;
            background-color: var(--pastel-blue-light);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* กล่องการ์ดหลักขนาดพอดีมือถือ โค้งมนนุ่มฟู */
        .payment-box {
            width: 100%;
            max-width: 380px;
            background-color: var(--white);
            border-radius: 32px;
            box-shadow: 0 12px 30px rgba(108, 166, 205, 0.15);
            padding: 28px 24px;
            text-align: center;
            border: 3px solid var(--white);
            outline: 2px dashed var(--pastel-blue);
            outline-offset: -8px;
        }

        /* โลโก้และหัวข้อ */
        .icon-header {
            font-size: 2.5rem;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        h2 {
            font-family: 'Fredoka', 'Mitr', sans-serif;
            color: var(--pastel-blue-dark);
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

            font-size: 0.85rem;
            color: var(--text-sub);
